[project]
name = "update-alternatives-tui"
version = "0.3.0"
description = "A TUI (Text User Interface) for managing Linux update-alternatives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=6.11.0",
]
keywords = ["update-alternatives", "tui", "linux", "system-administration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
update-alternatives-tui = "update_alternatives_tui.app:main"
ua-tui = "update_alternatives_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (uses real system data)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
